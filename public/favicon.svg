<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#dc3545"/>
  <!-- left bearish candle -->
  <line x1="16" y1="14" x2="16" y2="50" stroke="white" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="11.5" y="20" width="9" height="20" rx="2" fill="white" fill-opacity="0.45"/>
  <!-- centre bullish candle -->
  <line x1="32" y1="10" x2="32" y2="50" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="26.5" y="18" width="11" height="24" rx="2.2" fill="white"/>
  <!-- right bullish candle -->
  <line x1="48" y1="18" x2="48" y2="50" stroke="white" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="43.5" y="26" width="9" height="16" rx="2" fill="white" fill-opacity="0.8"/>
  <!-- rising trend -->
  <path d="M10 44 C20 38, 26 30, 33 25 C40 20, 46 18, 54 15" stroke="white" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
